  "@langchain/core": "^1.1.32"
  "@langchain/langgraph": "^1.2.2"
  "@langchain/mcp-adapters": "^1.1.3"
  "@langchain/openai": "^0.5.0"

  # Microsoft 365 Agents SDK packages
  "@microsoft/agents-hosting": "^1.3.1"
  "@microsoft/agents-activity": "^1.3.1"

  # Hono - required peer dependency for MCP SDK and OpenAI agents
  "hono": "^4.11.7"

  # Model Context Protocol SDK
  "@modelcontextprotocol/sdk": "^1.26.0"

  # OpenAI Agents packages
  "@openai/agents": "^0.7.0"
  "@openai/agents-core": "^0.7.0"
  "@openai/agents-openai": "^0.7.0"
  "openai": "^6.27.0"

  # OpenTelemetry packages - align versions
  "@opentelemetry/core": "^2.6.0"
  "@opentelemetry/api": "^1.9.0"
  "@opentelemetry/exporter-trace-otlp-http": "^0.213.0"
  "@opentelemetry/instrumentation": "^0.213.0"
  "@opentelemetry/resources": "^2.6.0"
  "@opentelemetry/sdk-node": "^0.213.0"
  "@opentelemetry/sdk-trace-base": "^2.6.0"
  "@opentelemetry/semantic-conventions": "^1.40.0"

  # Development dependencies - align versions
  "@babel/preset-typescript": "^7.27.1"
  "@eslint/js": "^9.39.1"
  "@jest/globals": "^30.2.0"
  "@microsoft/m365agentsplayground": "^0.2.18"
  "@types/express": "^5.0.0"
  "@types/jest": "^30.0.0"
  "@types/jsonwebtoken": "^9.0.10"
  "@types/node": "^20.17.0"
  "@types/uuid": "^9.0.8"
  "@typescript-eslint/eslint-plugin": "^8.47.0"
  "@typescript-eslint/parser": "^8.47.0"
  "cross-env": "^7.0.3"
  "dotenv": "^17.2.2"
  "eslint": "^9.39.1"
  "jest": "^30.2.0"
  "js-yaml": "^4.1.1"
  "nodemon": "^3.1.10"
  "rimraf": "^6.0.0"
  "ts-jest": "^29.4.5"
  "tsx": "^4.21.0"
  "typescript": "^5.9.3"
  "typescript-eslint": "^8.47.0"
  "uuid": "^9.0.1"

overrides:
  # Brace expansion - update for bug fixes
  "@isaacs/brace-expansion": "^5.0.1"

  # Zod
  "zod": "^4.1.12"

  # fast-uri - security remediation. Forces a patched release that fixes two URI
  # normalization issues: percent-encoded authority-delimiter decoding (fixed in
  # 3.1.2) and percent-encoded path-separator / dot-segment decoding (fixed in
  # 3.1.1). Pinned within the 3.x line to satisfy ajv@8's "fast-uri: ^3.0.1"
  # requirement. Remove once the transitive parents (ajv /
  # @modelcontextprotocol/sdk) resolve a patched fast-uri by default.
  "fast-uri": "^3.1.2"

  # axios - security remediation (S360 [SFI-ES5.2] 1ES Open Source Vulnerabilities).
  # Forces the transitive axios@1.15.2 up to the patched 1.16.0, which fixes:
  # CVE-2026-44486 (Proxy-Authorization header leak on re-evaluated redirect),
  # CVE-2026-44487 (Proxy-Authorization credential leak across HTTP->HTTPS
  # redirect), CVE-2026-44488 (unbounded resource allocation / no throttling),
  # CVE-2026-44492 (NO_PROXY bypass via IPv4-mapped IPv6, incomplete fix for
  # CVE-2025-62718), and CVE-2026-44494 (MITM via prototype-pollution gadget in
  # config.proxy). Remove once the transitive parents resolve a patched axios
  # by default.
  "axios": "^1.16.0"

  # protobufjs - security remediation (S360 [SFI-ES5.2] 1ES Open Source
  # Vulnerabilities). Forces the transitive protobufjs@7.5.5 up to the patched
  # 7.5.6, which fixes: CVE-2026-44289 (denial of service via unbounded
  # protobuf recursion), CVE-2026-44291 (code-generation gadget after
  # prototype pollution), and CVE-2026-44293 (code injection through bytes
  # field defaults in generated toObject code). Pinned within the 7.x line to
  # avoid the breaking 8.x major. Remove once the transitive parents resolve a
  # patched protobufjs by default.
  "protobufjs": "^7.5.6"

  # langsmith - security remediation (S360 [SFI-ES5.2] 1ES Open Source
  # Vulnerabilities). Forces the transitive langsmith@0.5.25 up to the patched
  # 0.8.0, which fixes CVE-2026-45134 (public prompt pull deserializes
  # untrusted manifests without a trust-boundary warning). Remove once the
  # transitive parents (langchain) resolve a patched langsmith by default.
  "langsmith": "^0.8.0"

  # Development dependencies - align versions
  "@types/uuid": "^9.0.0"
  "uuid": "^10.0.0"

# Workspace settings
linkWorkspacePackages: true
sharedWorkspaceLockfile: true
saveWorkspaceProtocol: "rolling"
hoistWorkspacePackages: true

# Node.js version specification
useNodeVersion: "20.18.0"

# Dependency resolution settings
resolutionMode: "highest"
autoInstallPeers: true
strictPeerDependencies: false

# Performance settings
nodeLinker: "hoisted"
enableModulesDir: true
virtualStoreDir: "node_modules/.pnpm"

# Security settings
auditConfig:
  ignoreCves: []
  ignoreGhsas: []
