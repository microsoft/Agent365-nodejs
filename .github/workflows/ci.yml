name: CI - Build, Test, and Publish SDKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  changed-sdks:
    name: Determine Changed SDKs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      nodejs-sdk: ${{ steps.check_nodejs_sdk.outputs.changed }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - id: git_refs
      name: Set Git refs for diff
      run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

    - id: check_nodejs_sdk
      name: Check Node.js SDK changes
      run: |
        if git diff --name-only "${{ steps.git_refs.outputs.base }}" "${{ steps.git_refs.outputs.head }}" -- '/**' | grep -q .; then
          echo "Node.js SDK changes detected"
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "No Node.js SDK changes detected"
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

  nodejs-sdk:
    name: Node.js SDK
    needs: [changed-sdks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./

    strategy:
      matrix:
        node-version: ['18', '20']

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      name: Install pnpm
      with:
        run_install: false

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        cache-dependency-path: '**/pnpm-lock.yaml'

    - name: Setup pnpm
      uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
      with:
        version: 10.20.0

    - name: Match pnpm runtime to selected Node.js
      run: pnpm config set --location=project useNodeVersion "$(node -p 'process.versions.node')"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint code
      run: pnpm lint

    - name: Set version with Nerdbank.GitVersioning
      run: node setVersion.js

    - name: Build package
      run: pnpm build

    - name: Type check remaining packages
      run: pnpm typecheck

    - name: Run tests
      env:
        A365_EXPECTED_NODE_MAJOR: ${{ matrix.node-version }}
      run: pnpm test

    - name: Pack packages
      run: pnpm run pack artifacts/release-${{ matrix.node-version }}

    - name: Verify release artifacts independently
      run: node packPackages.js --verify artifacts/release-${{ matrix.node-version }}

    - name: Upload NPM packages as artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: nodejs-${{ matrix.node-version }}
        path: artifacts/release-${{ matrix.node-version }}/
        if-no-files-found: error
